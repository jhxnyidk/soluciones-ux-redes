<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"content="Portal de monitoreo del estado de los equipos computacionales del establecimiento.">
  <title>Portal de Monitoreo de Equipos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <linkhref="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-content">
      <span class="header-label">
        MONITOREO
      </span>
    </div>
  </header>
  <main class="container dashboard">
    <section class="hero-section" aria-labelledby="titulo-principal">
      <h1 id="titulo-principal">
        Portal de Monitoreo de Equipos
      </h1>
      <p class="subtitle">
        Revisa el estado de los computadores del establecimiento.
      </p>

    </section>

    <section class="status-section" aria-label="Resumen del estado de los equipos">
      <article class="summary-card status-working">
        <div class="summary-content">
          <div class="status-label">
            <span class="status-dot"></span>
            <span>Funcionando</span>
          </div>
          <strong class="status-number">
            18
          </strong>
        </div>
      </article>

      <article class="summary-card status-review">
        <div class="summary-content">
          <div class="status-label">
            <span class="status-dot"></span>
            <span>Revisar</span>
          </div>
          <strong class="status-number">
            4
          </strong>
        </div>
      </article>

      <article class="summary-card status-problem">
        <div class="summary-content">
          <div class="status-label">
            <span class="status-dot"></span>
            <span>Problema</span>
          </div>
          <strong class="status-number">
            2
          </strong>
        </div>
      </article>
    </section>

    <section class="problems-section" aria-labelledby="problemas-titulo">
      <div class="problem-box">
        <h2 id="problemas-titulo" class="problem-header">
          EQUIPOS CON PROBLEMAS
        </h2>

        <article class="problem-row">
          <span class="problem-name">
            Laboratorio 03
          </span>
          <span class="badge badge-review">
            <span class="badge-dot"></span>
            Revisar
          </span>
        </article>
        <article class="problem-row">
          <span class="problem-name">
            Laboratorio 04
          </span>
          <span class="badge badge-problem">
            <span class="badge-dot"></span>
            Problema
          </span>
        </article>
      </div>
    </section>
    <section class="action-section" aria-label="Acciones">
      <a href="equipos.html" class="primary-button">
        Ver equipos
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <span>
        Portal de Monitoreo de Equipos
      </span>
      <span>
        Estado actualizado
      </span>
    </div>
  </footer>

</body>

</html>
