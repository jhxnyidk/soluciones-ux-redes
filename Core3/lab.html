<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalle del estado del Laboratorio 04.">

  <title>Laboratorio 04 | Monitoreo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-content">
      <span class="header-label">
        MONITOREO
      </span>
    </div>
  </header>
  <main class="container detail-page">
    <section class="detail-heading" aria-labelledby="titulo-laboratorio">
      <a href="equipos.html" class="back-link">
        Volver a equipos
      </a>
      <h1 id="titulo-laboratorio">
        Laboratorio 04
      </h1>
      <div class="detail-status">
        <span class="badge badge-problem">
          <span class="badge-dot"></span>
          Problema
        </span>
      </div>
      <p class="detail-description">
        El computador presenta lentitud y problemas de rendimiento.
      </p>
    </section>
    <section class="details-section" aria-labelledby="informacion-equipo">
      <h2 id="informacion-equipo" class="visually-hidden">
        Información del equipo
      </h2>
      <div class="data-box">
        <div class="data-row">
          <span>
            Estado
          </span>
          <strong class="red">
            Problema
          </strong>
        </div>
        <div class="data-row">
          <span>
            Último mantenimiento
          </span>
          <span class="dark-text">
            01/08/2026
          </span>
        </div>
        <div class="data-row">
          <span>
            Rendimiento
          </span>
          <strong class="orange">
            Bajo
          </strong>
        </div>
      </div>
    </section>
    <section class="action-section detail-action" aria-label="Reportar problema">
      <button type="button" class="report-button" onclick="reportarProblema()">
        Reportar problema
      </button>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-content">
      <span>
        Portal de Monitoreo de Equipos
      </span>
    </div>
  </footer>

  <script>
    function reportarProblema() {
      alert(
        "Problema reportado para Laboratorio 04."
      );
    }
  </script>

</body>

</html>
